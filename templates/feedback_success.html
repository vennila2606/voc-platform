{% extends "base.html" %}
{% block title %}Thank You{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="auth-card text-center">
    <div class="auth-icon mx-auto">✅</div>
    <h3 class="mt-3">Thanks for your feedback, {{ name }}!</h3>
    <p class="text-muted-voc">Your review has been recorded and will help us improve.</p>
    <a href="{{ url_for('give_feedback') }}" class="btn btn-outline-light mt-2">Submit another</a>
  </div>
</div>
{% endblock %}
