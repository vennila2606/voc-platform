{% extends "base.html" %}
{% block title %}Admin Login{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="auth-card text-center">
    <div class="auth-icon mx-auto">⟳</div>
    <h3 class="mt-3 mb-0">Admin Login</h3>
    <p class="text-muted-voc">Secure access to VoC Platform</p>

    <form method="POST" class="text-start mt-4">
      <div class="mb-3">
        <label class="form-label">Username</label>
        <input type="text" name="username" class="form-control voc-input" placeholder="admin@vocplatform.com" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Password</label>
        <input type="password" name="password" class="form-control voc-input" placeholder="••••••••" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Role</label>
        <select name="role" class="form-select voc-input">
          <option value="admin">Admin</option>
          <option value="manager">Manager</option>
          <option value="agent">Agent</option>
        </select>
      </div>
      <button type="submit" class="btn btn-primary-glow w-100 py-2">→ Login to Dashboard</button>
    </form>
    <a href="{{ url_for('index') }}" class="d-block mt-3 back-link">← Back to Home</a>
  </div>
</div>
{% endblock %}
